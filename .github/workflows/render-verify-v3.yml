name: Render Verify V3

on:
  push:
    branches:
      - codex/render-verify-v3

permissions:
  contents: read

jobs:
  verify-render:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check deployed Render commit and runtime
        shell: bash
        run: |
          set -euo pipefail
          URL="https://btc-trading-bot-v1.onrender.com/api/bootstrap"
          curl --silent --show-error --location --fail-with-body             --connect-timeout 15 --max-time 90             --retry 2 --retry-delay 5 --retry-all-errors             --header "User-Agent: btc-trading-bot-render-verify/1.0"             --output /tmp/bootstrap.json "$URL"
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/bootstrap.json').read_text(encoding='utf-8'))
          safe = {
              'ok': data.get('ok'),
              'ui': data.get('ui'),
              'bot_status': data.get('bot_status'),
              'execution_thread': data.get('execution_thread'),
              'execution_error': data.get('execution_error'),
              'last_execution_result': data.get('last_execution_result'),
              'orders_enabled': data.get('orders_enabled'),
              'market_data_source': data.get('market_data_source'),
              'render_git_commit': data.get('render_git_commit'),
          }
          print(json.dumps(safe, ensure_ascii=False))
          PY

          curl --silent --show-error --location --fail-with-body --connect-timeout 15 --max-time 90 --header "User-Agent: btc-trading-bot-render-verify/1.0" --output /tmp/snapshot.json "https://btc-trading-bot-v1.onrender.com/api/snapshot"
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/snapshot.json').read_text(encoding='utf-8'))
          active = data.get('active_trade') or {}
          execution = data.get('execution') or {}
          safe = {
              'final_decision': data.get('final_decision'),
              'active_trade': {
                  'status': active.get('status'),
                  'side': active.get('side'),
                  'entry_price': active.get('entry_price'),
                  'mark_price': active.get('mark_price'),
                  'unrealized_pnl': active.get('unrealized_pnl'),
                  'current_r': active.get('current_r'),
                  'mfe_r': active.get('mfe_r'),
                  'protected_r': active.get('protected_r'),
                  'management_state': active.get('management_state'),
                  'context_status': active.get('context_status'),
              },
              'execution': {
                  'last_execution_result': execution.get('last_execution_result'),
                  'fast_profit_mfe_r': execution.get('fast_profit_mfe_r'),
                  'fast_profit_armed': execution.get('fast_profit_armed'),
                  'fast_profit_partial_taken': execution.get('fast_profit_partial_taken'),
                  'fast_profit_last_action': execution.get('fast_profit_last_action'),
                  'protection_reconciliation_required': execution.get('protection_reconciliation_required'),
                  'protection_reconciliation_reason': execution.get('protection_reconciliation_reason'),
                  'active_alert_state': execution.get('active_alert_state'),
                  'last_error': execution.get('last_error'),
              },
          }
          print(json.dumps(safe, ensure_ascii=False))
          PY


          curl --silent --show-error --location --fail-with-body --connect-timeout 15 --max-time 90 --header "User-Agent: btc-trading-bot-render-verify/1.0" --output /tmp/account.json "https://btc-trading-bot-v1.onrender.com/api/account"
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/account.json').read_text(encoding='utf-8'))
          positions = []
          for p in data.get('positions') or []:
              if str(p.get('symbol')) == 'BTCUSDT':
                  positions.append({
                      'symbol': p.get('symbol'),
                      'position_amt': p.get('position_amt'),
                      'side': p.get('side'),
                      'entry_price': p.get('entry_price'),
                      'mark_price': p.get('mark_price'),
                      'unrealized_pnl': p.get('unrealized_pnl'),
                  })
          orders = []
          for o in data.get('open_orders') or []:
              orders.append({
                  'orderType': o.get('orderType') or o.get('type'),
                  'side': o.get('side'),
                  'triggerPrice': o.get('triggerPrice') or o.get('stopPrice') or o.get('trigger_price'),
                  'quantity': o.get('quantity') or o.get('origQty') or o.get('requested_quantity'),
                  'reduceOnly': o.get('reduceOnly') if 'reduceOnly' in o else o.get('reduce_only'),
                  'closePosition': o.get('closePosition'),
                  'status': o.get('algoStatus') or o.get('status'),
                  'algoId': o.get('algoId') or o.get('binance_order_id'),
              })
          print(json.dumps({'positions': positions, 'open_orders': orders}, ensure_ascii=False))
          PY
