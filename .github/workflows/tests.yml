name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q .
      - name: Dashboard self-test
        run: python dashboard_server.py --self-test
      - name: Pytest
        # This single legacy wrapper hard-codes the original Windows checkout
        # path and only re-runs tests that are already collected by this command.
        run: pytest -q --deselect=tests/test_phase1_infra.py::test_existing_regression_still_passes
