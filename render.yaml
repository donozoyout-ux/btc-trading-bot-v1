services:
  - type: web
    name: btc-intelligence-console
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: >-
      python -m pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python -m compileall -q . &&
      python dashboard_server.py --self-test
    startCommand: python start_dashboard.py
    healthCheckPath: /api/bootstrap
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENV
        value: testnet
      - key: BINANCE_TESTNET
        value: "true"
      - key: ACCOUNT_READ_ONLY
        value: "false"
      - key: ORDER_SUBMISSION_ENABLED
        value: "true"
      - key: SHADOW_MODE
        value: "false"
      - key: RUN_EXECUTION_SMOKE_TEST
        value: "false"
      - key: TEST_ORDER_NOTIONAL_USDT
        value: "10"
      - key: MAX_OPEN_POSITIONS
        value: "1"
      - key: EXECUTION_POLL_SECONDS
        value: "15"
      - key: NEWS_ENABLED
        value: "true"
      - key: AI_ENABLED
        value: "false"
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: COINGLASS_API_KEY
        sync: false
      - key: COINMARKETCAP_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
